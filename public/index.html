<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="app-version" content="2.0.6">
<meta name="theme-color" content="#141414">
<title>Concours Judging Assistant</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- Password -->
<section id="gate" class="gate" aria-label="Sign in">
  <div class="gate__inner">
    <p class="wordmark">Autovision Studios</p>
    <h1 class="gate__title">Concours<br>Judging Assistant</h1>
    <label class="field">
      <span class="field__label">Event password</span>
      <input id="password" type="password" autocomplete="current-password" enterkeyhint="go" autocapitalize="none">
    </label>
    <p id="gateError" class="msg msg--error" role="alert" hidden></p>
    <button id="enter" class="btn btn--primary">Enter</button>
  </div>
</section>

<!-- Main -->
<main id="app" class="app" hidden>
  <header class="bar">
    <p class="wordmark wordmark--sm">Autovision Studios</p>
    <button id="openSources" class="linkbtn">Source Documents</button>
  </header>

  <!-- Judging category: sticky for the session (A.9) -->
  <section id="categoryPick" class="pick" aria-label="Choose judging category">
    <h2 class="pick__title">Which category are you judging?</h2>
    <p class="pick__hint">This stays set for the session.</p>
    <div class="pick__row" role="group">
      <button class="chip chip--lg" data-category="Exterior">Exterior</button>
      <button class="chip chip--lg" data-category="Interior">Interior</button>
      <button class="chip chip--lg" data-category="Engine and Chassis">Engine &amp; Chassis</button>
    </div>
  </section>

  <div id="work" hidden>
    <!-- Car context strip -->
    <section class="context" aria-label="Current car">
      <div class="context__line">
        <span id="carLabel" class="context__car">No car selected</span>
        <span class="context__role" id="roleLabel"></span>
      </div>
      <div id="classPick" class="context__class" hidden>
        <span class="context__prompt">Select class</span>
        <button class="chip" data-class="Regular">Regular</button>
        <button class="chip" data-class="Preservation">Preservation</button>
      </div>
      <div class="context__actions">
        <button id="newCar" class="linkbtn" hidden>New car</button>
      </div>
    </section>

    <!-- Car entry -->
    <section id="carEntry" class="card">
      <label class="field">
        <span class="field__label">Year</span>
        <input id="carYear" type="number" inputmode="numeric" min="1940" max="2030" placeholder="1967">
      </label>
      <label class="field">
        <span class="field__label">Model</span>
        <input id="carModel" type="text" autocapitalize="characters" placeholder="330 GTC" enterkeyhint="done">
      </label>
      <button id="setCar" class="btn btn--primary">Set car</button>
      <p id="carError" class="msg msg--error" role="alert" hidden></p>
    </section>

    <!-- Question -->
    <section class="card">
      <label class="field">
        <span class="field__label">Question</span>
        <textarea id="question" rows="3" enterkeyhint="send"
          placeholder="Are the knock-off spinners correct?"></textarea>
      </label>
      <p id="nudge" class="msg msg--nudge" role="alert" hidden></p>
      <button id="ask" class="btn btn--primary">Ask</button>
      <p id="lastQuestion" class="lastq" hidden></p>
    </section>

    <div id="loading" class="loading" hidden>
      <span class="loading__dot"></span> Searching approved source documents…
    </div>

    <!-- Answer -->
    <section id="answerCard" class="card card--answer" hidden aria-live="polite">
      <p id="statusLabel" class="status"></p>
      <p id="answerText" class="answer"></p>
      <div id="specBlock" class="block" hidden>
        <p class="block__label">Correct specification</p>
        <p id="specText" class="block__body"></p>
      </div>
      <div id="conflictBlock" class="block block--conflict" hidden>
        <p class="block__label">What the sources disagree about</p>
        <p id="conflictText" class="block__body"></p>
      </div>
      <p id="reasonText" class="reason" hidden></p>
      <div id="sources" class="sources"></div>
      <p id="sourceError" class="msg msg--error" role="alert" hidden></p>
      <p id="judgeNote" class="judgenote" hidden></p>
      <div id="answerWarnings" class="warnings" hidden></div>
      <div class="answer__actions">
        <button id="newQuestion" class="btn btn--ghost">New question</button>
        <button id="retry" class="btn btn--ghost" hidden>Retry</button>
      </div>
    </section>
  </div>
</main>

<!-- Source viewer -->
<section id="viewer" class="viewer" hidden aria-label="Source document">
  <header class="viewer__bar">
    <button id="viewerBack" class="viewer__back" aria-label="Back to answer">Back</button>
    <span id="viewerTitle" class="viewer__title"></span>
  </header>
  <div class="viewer__meta">
    <button id="prevPage" class="chip">Previous</button>
    <span id="pageLabel" class="viewer__page"></span>
    <button id="nextPage" class="chip">Next</button>
  </div>
  <iframe id="viewerFrame" class="viewer__frame" title="Source page"></iframe>
  <a id="viewerOpen" class="viewer__open" target="_blank" rel="noopener">Open page in a new tab</a>
</section>

<!-- Source documents list -->
<section id="docs" class="viewer" hidden aria-label="Source documents">
  <header class="viewer__bar">
    <button id="docsBack" class="viewer__back" aria-label="Back">Back</button>
    <span class="viewer__title">Source Documents</span>
  </header>
  <p id="docsError" class="msg msg--error" role="alert" hidden></p>
  <div id="docsList" class="docs"></div>
</section>

<script src="/app.js"></script>
</body>
</html>
